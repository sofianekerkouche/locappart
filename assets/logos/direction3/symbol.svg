      <stop offset="0%" stop-color="#194B60"/>
      <stop offset="100%" stop-color="#0D222E"/>
    </linearGradient>
    <linearGradient id="d3-pillar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23617A"/>
      <stop offset="100%" stop-color="#123847"/>
